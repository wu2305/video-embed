[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mmindex"
version = "0.1.0"
description = "Multimodal media indexer: scan, infer, cluster and search images and video scenes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "xxhash>=3.4",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1",
    "transformers>=4.40",
    "sentencepiece>=0.1.99",
    "onnxruntime>=1.17",
    "insightface>=0.7.3",
    "rapidocr-onnxruntime>=1.3",
    "faster-whisper>=1.0",
    "scenedetect>=0.6.4",
    "opencv-python>=4.9",
    "av<19",
]
cluster = [
    "hdbscan>=0.8.33",
    "scikit-learn>=1.3",
]
benchmark = [
    "datasets>=2.18",
    "huggingface_hub>=0.23",
    "scikit-learn>=1.3",
    "opencv-python>=4.9",
]
dev = [
    "pytest>=8.0",
]
test = [
    "pytest>=8.0",
    "opencv-python>=4.9",
    "scenedetect>=0.6.4",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.3",
]

[project.scripts]
mmindex = "mmindex.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mmindex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
