# CNB pipeline for the multimodal media indexer.
#
# `$` holds repository-level events (vscode). Branch-scoped events live under
# the concrete branch names. Every job builds the same image from .ide/Dockerfile
# so OpenCV's libGL dependency is present wherever the ML stack is imported.
#
# The CI job runs the full suite plus a hash-backend pipeline run, proving the
# scan → infer → cluster → export → search path on every push. The dev
# environment additionally runs the real ML backend check, since that is where
# the model weights and ML extras are installed.

$:
  vscode:
    - name: mmindex-dev
      runner:
        cpus: 8
      docker:
        build:
          dockerfile: .ide/Dockerfile
        # Keep downloaded datasets and model weights between dev-environment
        # restarts; re-downloading several GB on every start is wasteful.
        volumes:
          - /workspace/benchmark_corpus:read-write
          - /root/.cache/huggingface:read-write
          - /root/.insightface:read-write
      services:
        - vscode
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        MMINDEX_BACKEND: hash
      stages:
        - name: bootstrap
          script:
            - python -m pip install --quiet -U pip
            - python -m pip install --quiet -e ".[ml,test,benchmark]"
            - python -c "import mmindex; print('mmindex', mmindex.__version__)"
        - name: test
          timeout: 30m
          script: python -m pytest -q
        - name: smoke
          script: bash scripts/smoke.sh
        - name: ml-check
          timeout: 60m
          script: python scripts/ml_check.py
        - name: benchmark
          timeout: 4h
          script: python scripts/benchmark.py

main:
  push:
    - name: ci
      runner:
        cpus: 8
      docker:
        build:
          dockerfile: .ide/Dockerfile
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      stages:
        - name: install
          script:
            - python -m pip install --quiet -U pip
            - python -m pip install --quiet -e ".[test]"
        - name: lint
          script:
            - python -m pip install --quiet ruff
            - ruff check src tests --select F,E9
        - name: test
          timeout: 30m
          script: python -m pytest -q
        - name: smoke
          script: bash scripts/smoke.sh
  pull_request:
    - name: pr-check
      runner:
        cpus: 4
      docker:
        build:
          dockerfile: .ide/Dockerfile
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      stages:
        - name: install
          script:
            - python -m pip install --quiet -U pip
            - python -m pip install --quiet -e ".[test]"
        - name: test
          timeout: 30m
          script: python -m pytest -q
      failStages:
        - name: report-failure
          script: 'echo "PR check failed for $CNB_PULL_REQUEST_IID $CNB_BUILD_FAILED_MSG"'
